<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Track Order — BalochHunar</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="../css/style.css">
  <script>tailwind.config={theme:{extend:{colors:{terracotta:{DEFAULT:'#B85042',dark:'#963B2F'},sandstone:{light:'#FBF6EF'},indigo:{dark:'#0F172A'}}}}}</script>
</head>
<body class="bg-[#FAF8F5] min-h-screen text-gray-800"><header class="bg-white border-b border-[#E8E2D9]"><div class="max-w-4xl mx-auto px-4 py-5 flex justify-between"><a href="index.html" class="font-serif text-xl font-bold text-gray-900">BalochHunar</a><a href="products.html" class="text-xs font-semibold text-gray-600">Catalog</a></div></header>
<main class="max-w-4xl mx-auto px-4 py-10"><h1 class="font-serif text-3xl font-bold text-gray-900">Track Your BalochHunar Order</h1><p class="text-sm text-gray-500 mt-2">Use the private tracking link provided after checkout.</p><div id="track-error" class="hidden mt-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm"></div><section id="track-card" class="hidden mt-8 bg-white border border-[#E8E2D9] rounded-2xl p-6 shadow-sm"><div class="flex flex-col sm:flex-row justify-between gap-3 border-b pb-5"><div><span class="text-[11px] uppercase text-gray-400 font-bold">Order number</span><h2 id="order-number" class="font-serif text-xl font-bold"></h2><p id="order-date" class="text-xs text-gray-500 mt-1"></p></div><div class="text-left sm:text-right"><span id="order-status" class="inline-flex px-3 py-1 rounded-full bg-sandstone-light text-terracotta text-xs font-bold"></span><p id="payment-status" class="text-xs text-gray-500 mt-2"></p></div></div><div id="order-items" class="py-5 space-y-3 border-b"></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-4 py-5 text-xs"><div><span class="text-gray-400 block">Subtotal</span><strong id="order-subtotal"></strong></div><div><span class="text-gray-400 block">Delivery</span><strong id="order-delivery"></strong></div><div><span class="text-gray-400 block">Total</span><strong id="order-total" class="text-terracotta"></strong></div><div><span class="text-gray-400 block">Courier</span><strong id="order-courier">Not assigned</strong></div></div><div class="p-5 bg-gray-50 rounded-xl"><h3 class="font-serif font-bold text-lg">Order timeline</h3><ol id="timeline" class="mt-4 space-y-4"></ol></div></section></main><script src="../js/api.js"></script><script src="../js/track-order.js"></script></body></html>
