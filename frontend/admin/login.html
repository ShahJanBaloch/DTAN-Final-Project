<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — BalochHunar Digital Artisan Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              terracotta: {
                DEFAULT: "#B85042",
                dark: "#963B2F",
                light: "#F7EDE2",
              },
              sandstone: {
                DEFAULT: "#F59E0B",
                light: "#FFFBEB",
                dark: "#B45309",
              },
              indigo: {
                DEFAULT: "#1E1B4B",
                dark: "#0D0B2F",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-[#F8F7FF] min-h-screen flex items-center justify-center p-4 bg-pattern"
  >
    <div class="max-w-md w-full">
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <img
          src="./Balochhunar logo1.png"
          alt="balochhunar logo"
          height="50px"
          width="70px"
          class="rounded-2xl ml-[50%] transform -translate-x-1/2 shadow-md group-hover:scale-105 transition mb-[10px]"
        />
        <h1 class="font-serif text-3xl font-bold text-gray-900 tracking-tight">
          Baloch <span class="text-terracotta">Hunar</span>
        </h1>
        <p
          class="text-xs uppercase tracking-widest text-terracotta font-semibold mt-1"
        >
          Digital Artisan &amp; Business Platform
        </p>
        <p class="text-sm text-gray-600 mt-2">
          Sign in to access your administrative workspace
        </p>
      </div>

      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-xl border border-[#E8E2D9] p-8">
        <!-- Error Alert -->
        <div
          id="error-alert"
          class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start gap-3"
        >
          <i class="fas fa-exclamation-circle text-lg mt-0.5 text-red-500"></i>
          <span id="error-message">Invalid credentials provided.</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">
          <div>
            <label
              for="email"
              class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2"
              >Email Address</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"
              >
                <i class="fas fa-envelope"></i>
              </div>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="admin@balochhunar.com"
                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-terracotta focus:bg-white focus:outline-none text-sm transition"
              />
            </div>
          </div>

          <div>
            <label
              for="password"
              class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2"
              >Password</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"
              >
                <i class="fas fa-lock"></i>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="••••••••"
                class="w-full pl-10 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-terracotta focus:bg-white focus:outline-none text-sm transition"
              />
              <button
                type="button"
                id="toggle-password"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
              >
                <i class="fas fa-eye" id="toggle-icon"></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            id="submit-btn"
            class="w-full py-3.5 px-4 bg-terracotta hover:bg-terracotta-dark text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer"
          >
            <span id="btn-text">Sign In to Dashboard</span>
            <i id="btn-spinner" class="fas fa-spinner fa-spin hidden"></i>
          </button>
        </form>

        <!-- Evaluator Helper Notice -->
        <div
          class="mt-6 pt-6 border-t border-gray-100 bg-sandstone-light/50 rounded-xl p-3.5 text-xs text-gray-600"
        >
          <div
            class="flex items-center justify-between font-semibold text-gray-800 mb-1.5"
          >
            <span
              ><i class="fas fa-key text-sandstone-dark mr-1.5"></i> Assessment
              Credentials</span
            >
            <button
              type="button"
              id="fill-demo-btn"
              class="text-terracotta hover:underline font-bold text-xs"
            >
              Auto-fill
            </button>
          </div>
          <p class="text-gray-500 font-mono text-[11px]">
            Email: admin@balochhunar.com
          </p>
          <p class="text-gray-500 font-mono text-[11px]">Password: admin123</p>
        </div>
      </div>

      <!-- Return to Public Site -->
      <div class="text-center mt-6">
        <a
          href="../public/index.html"
          class="text-xs text-gray-500 hover:text-terracotta transition inline-flex items-center gap-1.5"
        >
          <i class="fas fa-arrow-left"></i> Return to BalochHunar Public
          Storefront
        </a>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script>
      // Auto-check if already logged in
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const res = await API.get("/auth/me");
          if (res.success && res.user) {
            window.location.href = "/admin/dashboard.html";
          }
        } catch (e) {
          // Not logged in, proceed to show login form
        }
      });

      // Password Visibility Toggle
      const toggleBtn = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("password");
      const toggleIcon = document.getElementById("toggle-icon");

      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleIcon.className = isPassword ? "fas fa-eye-slash" : "fas fa-eye";
      });

      // Auto-fill Demo Credentials
      document.getElementById("fill-demo-btn").addEventListener("click", () => {
        document.getElementById("email").value = "admin@balochhunar.com";
        document.getElementById("password").value = "admin123";
      });

      // Handle Form Submit
      const loginForm = document.getElementById("login-form");
      const errorAlert = document.getElementById("error-alert");
      const errorMessage = document.getElementById("error-message");
      const submitBtn = document.getElementById("submit-btn");
      const btnText = document.getElementById("btn-text");
      const btnSpinner = document.getElementById("btn-spinner");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        errorAlert.classList.add("hidden");
        btnText.textContent = "Verifying Credentials...";
        btnSpinner.classList.remove("hidden");
        submitBtn.disabled = true;

        try {
          const response = await API.post("/auth/login", { email, password });
          if (response.success) {
            API.showToast("Login successful! Redirecting...", "success");
            setTimeout(() => {
              window.location.href = "/admin/dashboard.html";
            }, 600);
          }
        } catch (error) {
          errorMessage.textContent =
            error.message || "Login failed. Please check your credentials.";
          errorAlert.classList.remove("hidden");
        } finally {
          btnText.textContent = "Sign In to Dashboard";
          btnSpinner.classList.add("hidden");
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
